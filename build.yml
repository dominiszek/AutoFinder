name: Build Anarchia AutoFinder

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Zainstaluj Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Przygotuj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Zbuduj moda
        run: gradle build

      - name: Pobierz plik JAR
        uses: actions/upload-artifact@v4
        with:
          name: Anarchia-AutoFinder-JAR
          path: build/libs/*.jar
